name: quality-gate

# Runs the checks that must pass before code lands on main.
# Today that is the TypeScript compiler; add further steps as the project grows.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci installs exactly what package-lock.json pins, and fails if the
      # lockfile is out of sync with package.json.
      - run: npm ci

      - run: npm run typecheck
